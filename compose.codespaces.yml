# Use AFTER docker-compose.yml. Requires Docker Compose >= 2.24.4.
# Nothing in this file is started by devcontainer lifecycle hooks.
services:
  postgres:
    ports: !reset []

  backend:
    # Additive preparation, without demo bootstrap/seeding on every restart.
    command: ["sh", "-c", "python -m app.db.prepare_release && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: !override
      - "127.0.0.1:8000:8000"
    environment: &codespaces_environment
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-384}
      HF_TOKEN: ""
      FINCREDIT_SPACE_KEY: ""
      HF_ALLOW_OLLAMA_FALLBACK: "false"
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      SIMULATION_PROVIDER: ollama
      SIMULATION_MODEL: qwen3.5:4b
      FRONTEND_URL: https://${CODESPACE_NAME:?Run inside a Codespace}-3000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
      CORS_ALLOWED_ORIGINS: https://${CODESPACE_NAME:?Run inside a Codespace}-3000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}

  committee-worker:
    environment: *codespaces_environment
    restart: "no"

  simulation-worker:
    environment: *codespaces_environment
    restart: "no"

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        FINCREDIT_API_PROXY_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      FINCREDIT_API_PROXY_URL: http://backend:8000

  ollama:
    image: ollama/ollama:0.40.11
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    # No published port, pull command, or generation in startup/health checks.

volumes:
  ollama_models:
