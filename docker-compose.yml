services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fincredit_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fincredit_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    command: ["sh", "-c", "python -m app.db.bootstrap_demo && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: &backend_environment
      APP_NAME: FinCredit AI
      APP_ENV: development
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      SIMULATION_MAX_AGENTS: ${SIMULATION_MAX_AGENTS:-6}
      SIMULATION_MAX_ROUNDS: ${SIMULATION_MAX_ROUNDS:-10}
      SIMULATION_MAX_MODEL_CALLS: ${SIMULATION_MAX_MODEL_CALLS:-40}
      SIMULATION_MAX_OUTPUT_TOKENS: ${SIMULATION_MAX_OUTPUT_TOKENS:-768}
      SIMULATION_MAX_RUNTIME_SECONDS: ${SIMULATION_MAX_RUNTIME_SECONDS:-3600}
      SIMULATION_STALE_SECONDS: ${SIMULATION_STALE_SECONDS:-600}
      SIMULATION_PROVIDER: ${SIMULATION_PROVIDER:-ollama}
      SIMULATION_MODEL: ${SIMULATION_MODEL:-}
      API_PREFIX: /api
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}@postgres:5432/fincredit_ai
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      HF_SPACE_ID: ${HF_SPACE_ID:-Sreemaan05/fincredit-ai-inference}
      HF_TOKEN: ${HF_TOKEN:-}
      FINCREDIT_SPACE_KEY: ${FINCREDIT_SPACE_KEY:-}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-180}
      HF_ALLOW_OLLAMA_FALLBACK: ${HF_ALLOW_OLLAMA_FALLBACK:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}

  committee-worker:
    build: ./backend
    command: ["python", "-m", "app.committee_worker"]
    restart: unless-stopped
    depends_on:
      - backend
    environment: *backend_environment

  simulation-worker:
    build: ./backend
    command: ["python", "-m", "app.simulation_worker"]
    restart: unless-stopped
    depends_on:
      - backend
    environment: *backend_environment

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
