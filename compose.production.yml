# Standalone production stack: docker compose --env-file .env.production -f compose.production.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincredit_ai
      POSTGRES_USER: fincredit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes: ["production_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincredit -d fincredit_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "python -m app.db.prepare_release && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &app_env
      APP_ENV: production
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      SIMULATION_MAX_AGENTS: ${SIMULATION_MAX_AGENTS:-6}
      SIMULATION_MAX_ROUNDS: ${SIMULATION_MAX_ROUNDS:-10}
      SIMULATION_MAX_MODEL_CALLS: ${SIMULATION_MAX_MODEL_CALLS:-40}
      SIMULATION_MAX_OUTPUT_TOKENS: ${SIMULATION_MAX_OUTPUT_TOKENS:-768}
      SIMULATION_MAX_RUNTIME_SECONDS: ${SIMULATION_MAX_RUNTIME_SECONDS:-3600}
      SIMULATION_STALE_SECONDS: ${SIMULATION_STALE_SECONDS:-600}
      SIMULATION_PROVIDER: ${SIMULATION_PROVIDER:-ollama}
      SIMULATION_MODEL: ${SIMULATION_MODEL:-}
      DATABASE_URL: ${DATABASE_URL:?Set postgresql://fincredit:URL_ENCODED_PASSWORD@postgres:5432/fincredit_ai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique secret of at least 40 characters}
      FRONTEND_URL: https://${DOMAIN:?Set the deployment domain}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-768}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      HF_SPACE_ID: ${HF_SPACE_ID:-Sreemaan05/fincredit-ai-inference}
      HF_TOKEN: ${HF_TOKEN:-}
      FINCREDIT_SPACE_KEY: ${FINCREDIT_SPACE_KEY:-}
      HF_ALLOW_OLLAMA_FALLBACK: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/db-check', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
  committee-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.committee_worker"]
    environment: *app_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend: {condition: service_healthy}
  simulation-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.simulation_worker"]
    environment: *app_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
volumes:
  production_db:
  caddy_data:
  caddy_config:
